[project]
name = "beacon-call"
version = "0.2.0"
requires-python = ">=3.11"
description = "Robot-camera incidents with LiveKit and Twilio outbound voice acknowledgment"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "livekit-agents[openai]>=1.5,<2",
  "openai>=3.6.0",
  "python-dotenv>=1.1,<2",
  "reportlab>=5.0.1",
  "typing_extensions",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pyyaml>=6.0,<7",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
